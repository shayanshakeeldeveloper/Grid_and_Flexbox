<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 16</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(15, 1fr);
            height: 100vh;
        }

        .header {
            background-color: rgb(0, 0, 50);
            color: white;
            text-align: center;
            padding-top: 10px;
            padding-bottom: 10px;
        }

        .menu {
            background-color: rgb(255, 0, 72);
            color: white;
            text-align: center;
            padding-top: 10px;
            padding-bottom: 10px;
            grid-column: span 3;
        }

        .hero {
            background-color: rgb(0, 153, 255);
            color: white;
            text-align: center;
            grid-column: span 4;
            grid-row: span 8;
            padding: 143px;
        }

        .main {
            background-color: rgb(17, 19, 47);
            color: white;
            text-align: center;
            grid-column: span 2;
            grid-row: span 4;
            padding: 67px;
        }

        .white {
            grid-row: span 4;
        }

        .image {
            background-color: rgb(172, 225, 232);
            text-align: center;
            grid-row: span 2;
            padding: 29px;
        }

        .extra {
            background-color: rgb(23, 181, 118);
            text-align: center;
            grid-row: span 2;
            padding: 29px;
        }

        .banner {
            background-color: rgb(225, 229, 117);
            text-align: center;
            grid-column: span 4;
            grid-row: span 2;
            padding: 29px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: repeat(4, 1fr);
                grid-template-rows: repeat(15, 1fr);
                height: 100vh;
            }

            .header {
                grid-column: span 4;
            }

            .hero {
                grid-column: 1 / 5;
                grid-row: 2 / 6;
                padding: 0;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .menu {
                grid-column: 1 / 2;
                grid-row: 6 / 13;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 0;
            }

            .main {
                grid-column: 2 / 5;
                grid-row: 6 / 9;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 0;
            }

            .white {
                display: none;
            }

            .banner {
                grid-column: 2 / 5;
                grid-row: 9 / 11;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 0;
            }

            .extra {
                grid-column: 2 / 4;
                grid-row: 11 / 13;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 0;
            }

            .image {
                grid-column: 4 / 5;
                grid-row: 11 / 13;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 0;
            }
        }

        @media (max-width: 412px) {

            .container {
                grid-template-columns: repeat(4, 1fr);
                grid-template-rows: repeat(15, 1fr);
                min-height: 100vh;
            }

            .header {
                grid-column: 1 / 5;
                grid-row: 1 / 2;
                padding: 10px;
            }

            .menu {
                grid-column: 1 / 5;
                grid-row: 2 / 4;
                padding: 20px;
            }

            .hero {
                grid-column: 1 / 5;
                grid-row: 4 / 8;
                padding: 50px 0;
            }

            .main {
                grid-column: 1 / 5;
                grid-row: 8 / 11;
                padding: 40px 0;
            }

            .banner {
                grid-column: 1 / 5;
                grid-row: 11 / 13;
                padding: 25px 0;
            }

            .extra {
                grid-column: 1 / 5;
                grid-row: 13 / 15;
                padding: 25px 0;
            }

            .image {
                grid-column: 1 / 5;
                grid-row: 15 / 16;
                padding: 25px 0;
            }

            .white {
                display: none;
            }

        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">HEADER</div>
        <div class="menu">MENU</div>
        <div class="hero">HERO</div>
        <div class="main">MAIN</div>
        <div class="white"></div>
        <div class="image">IMAGE</div>
        <div class="extra">EXTRA</div>
        <div class="banner">BANNER</div>
    </div>
</body>

</html>
